alertmanager:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 6h
    scrapeInterval: 60s
    evaluationInterval: 60s

grafana:
  enabled: true
  persistence:
    enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false